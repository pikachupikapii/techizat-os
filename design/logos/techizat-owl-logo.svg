<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2CBF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3A86FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06FFA5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background hexagon -->
  <polygon points="100,20 160,55 160,145 100,180 40,145 40,55" fill="none" stroke="url(#owlGradient)" stroke-width="2" opacity="0.6"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#owlGradient)" stroke-width="1" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Head (large circle) -->
  <circle cx="100" cy="85" r="40" fill="url(#owlGradient)" opacity="0.9"/>
  
  <!-- Left eye (bright) -->
  <circle cx="85" cy="75" r="12" fill="#06FFA5" filter="url(#glow)"/>
  <circle cx="85" cy="75" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="87" cy="73" r="4" fill="#000000"/>
  
  <!-- Right eye (bright) -->
  <circle cx="115" cy="75" r="12" fill="#06FFA5" filter="url(#glow)"/>
  <circle cx="115" cy="75" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="117" cy="73" r="4" fill="#000000"/>
  
  <!-- Beak -->
  <path d="M 100 90 L 110 100 L 100 105 Z" fill="#3A86FF"/>
  
  <!-- Left ear tuft -->
  <path d="M 70 55 Q 65 35 75 30" stroke="url(#owlGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Right ear tuft -->
  <path d="M 130 55 Q 135 35 125 30" stroke="url(#owlGradient)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="140" rx="32" ry="38" fill="url(#owlGradient)" opacity="0.8"/>
  
  <!-- Wing left -->
  <path d="M 70 130 Q 50 120 55 150 Q 65 160 75 155" fill="url(#owlGradient)" opacity="0.7"/>
  
  <!-- Wing right -->
  <path d="M 130 130 Q 150 120 145 150 Q 135 160 125 155" fill="url(#owlGradient)" opacity="0.7"/>
  
  <!-- Decorative hexagons around -->
  <polygon points="30,100 35,110 25,110" fill="#3A86FF" opacity="0.5"/>
  <polygon points="170,100 165,110 175,110" fill="#7B2CBF" opacity="0.5"/>
  <polygon points="100,30 105,40 95,40" fill="#06FFA5" opacity="0.5"/>
  <polygon points="100,170 105,160 95,160" fill="#3A86FF" opacity="0.5"/>
</svg>