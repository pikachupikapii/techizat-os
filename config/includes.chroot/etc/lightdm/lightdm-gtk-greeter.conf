# ============================================
# TECHIZAT OS - LİGHTDM GİRİŞ EKRANI
# Parrot OS tarzı, Techizat renk paleti
# ============================================

[greeter]

# Arka plan
background=/usr/share/techizat/lightdm-background.png
background-color=#080a5c

# Tema ve ikonlar
theme-name=Techizat
icon-theme-name=techizat-icons
font-name=DejaVu Sans 11
cursor-theme-name=default

# Logo (üst orta)
logo=/usr/share/pixmaps/techizat-logo.png

# Kullanıcı resmi gösterme (Parrot gibi gizle)
hide-user-image=false
default-user-image=/usr/share/pixmaps/techizat-logo.png

# Giriş kutusu pozisyonu (orta)
position=50%,center 50%,center

# Parola göster/gizle butonu
show-password-label=true
password-label-text=Parola:
show-indicators=~host;~spacer;~clock;~spacer;~a11y;~session;~language;~power

# Saat formatı (Parrot gibi üstte)
clock-format=%A, %d %B %Y  |  %H:%M

# Panel (üst bar)
panel-position=top

# Erişilebilirlik
a11y-states=+screenreader;+onscreen-keyboard;+font

# Oturum seçici
screensaver-timeout=60