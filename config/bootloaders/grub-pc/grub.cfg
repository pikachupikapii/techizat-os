# ============================================
# TECHIZAT OS - GRUB BOOT MENÜSÜ
# ============================================

set default=0
set timeout=10
set timeout_style=menu

# Tema
set theme=/boot/grub/themes/techizat/theme.txt
export theme

# Çözünürlük
set gfxmode=1920x1080,1280x720,auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

# Renk ayarları (tema yoksa fallback)
set color_normal=light-yellow/blue
set color_highlight=black/light-yellow
set menu_color_normal=light-yellow/blue
set menu_color_highlight=black/light-yellow

# ============================================
# BOOT SEÇENEKLERİ
# ============================================

menuentry "Techizat OS - Başlat" --class techizat --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "Techizat OS - Güvenli Mod" --class techizat --class gnu-linux {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components nomodeset
    initrd /live/initrd.img
}

menuentry "Techizat OS - RAM'a Yükle (Toram)" --class techizat --class gnu-linux {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components toram quiet splash
    initrd /live/initrd.img
}

menuentry "Techizat OS - Forensic Mod (Disk Bağlama)" --class techizat --class gnu-linux {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components noswap noautomount quiet splash
    initrd /live/initrd.img
}

menuentry "Diske Kur (Installer)" --class techizat {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components quiet splash desktop=xfce_
    initrd /live/initrd.img
}

menuentry "Bellek Testi (Memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}

menuentry "Bilgisayarı Yeniden Başlat" --class restart {
    reboot
}

menuentry "Bilgisayarı Kapat" --class shutdown {
    halt
}