# Techizat GRUB2 Configuration

insmod gfxterm
insmod png

# Set default boot
set default="0"
set timeout=10
set timeout_style=menu

# Colors and theme
if [ "${grub_platform}" = "efi" ]; then
  insmod efi_gop
  insmod efi_uga
else
  insmod vbe
fi

if [ "${grub_platform}" != "efi" ]; then
  terminal_input console
else
  terminal_input console
fi

terminal_output gfxterm

# Colors: Neon blue and cyan
set menu_color_normal=cyan/black
set menu_color_highlight=white/blue

# Load theme
set theme="(hd0,gpt1)/grub/theme"

# Menuentry for Techizat OS
menuentry 'Techizat OS (Debian-based Security OS)' --class gnu-linux --class os {
  insmod gzio
  insmod part_gpt
  insmod ext2
  set root='hd0,gpt2'
  echo 'Loading Techizat OS...'
  linux /boot/vmlinuz-* root=/dev/sda2 ro quiet splash vga=791
  initrd /boot/initrd.img-*
}

menuentry 'Techizat OS (Recovery Mode)' --class gnu-linux --class os {
  insmod gzio
  insmod part_gpt
  insmod ext2
  set root='hd0,gpt2'
  echo 'Loading Techizat OS (Recovery)...'
  linux /boot/vmlinuz-* root=/dev/sda2 ro single
  initrd /boot/initrd.img-*
}

menuentry 'UEFI Firmware Settings' {
  fwsetup
}

menuentry 'Reboot' {
  reboot
}

menuentry 'Power Off' {
  halt
}