[General]
# Techizat LightDM Greeter Configuration

# UI
theme-name=techizat
icon-theme-name=techizat-icons
cursor-theme-name=techizat-cursor
font-name=Dejavu Sans 11

# Background
background=/usr/share/pixmaps/techizat-wallpaper.png

# Login box position and appearance
position=50% 50%
user-background=false

# Appearance
high-contrast=false
screen-reader=false
show-password=false
show-remote-login=false
show-manual-login=false

# GTK theme
gtk-theme-name=techizat-gtk

# Display settings
show-language-selector=true
show-a11y=true

# Splash image (optional)
splash-image=/usr/share/pixmaps/techizat-splash.png

# Debug
debug=false